name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and build with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            # If gradlew is missing, use standard gradle if installed or find build files
            find . -name "gradlew"
            echo "Gradle wrapper not found in root, searching..."
            export GRADLE_W=$(find . -name "gradlew" | head -n 1)
            if [ -n "$GRADLE_W" ]; then
              chmod +x "$GRADLE_W"
              "$GRADLE_W" assembleDebug
            else
              echo "Error: gradlew not found anywhere in repository!"
              exit 1
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
